<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darl'Art crop widget demo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
  <link rel="stylesheet" href="assets/darlart-canvas-crop.css">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fafaf9; color: #111827; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .price { margin: 0 0 8px; color: #57534e; }
    .add-to-cart { width: 100%; min-height: 50px; border: 0; border-radius: 999px; background: #111827; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #result { margin-top: 20px; padding: 14px; border-radius: 10px; background: #fff; border: 1px solid #e7e5e4; font-size: 0.9rem; }
    #result img { max-width: 100%; border-radius: 6px; margin-top: 8px; }
    #result code { word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>Tableau peinture par numéros personnalisé</h1>
    <p class="price">Demo page: simulates a Shopify product form (nothing is sent)</p>

    <!-- stand-in for the theme's product form: the widget is rendered outside of it and linked with data-form-id -->
    <form id="product-form-demo" action="/cart/add" method="post" enctype="multipart/form-data">
      <input type="hidden" name="id" value="123456789">
    </form>

    <div class="dcc" data-form-id="product-form-demo" data-sizes="30x40,40x50,50x50,60x70" data-colors="12,24,36,48" data-default-colors="24"></div>

    <button type="submit" form="product-form-demo" class="add-to-cart">Ajouter au panier</button>
    <div id="result" hidden></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js" defer></script>
  <script src="assets/darlart-canvas-crop.js" defer></script>
  <script>
    // stand-in for the theme's AJAX add to cart: shows what would be sent to /cart/add
    document.getElementById('product-form-demo').addEventListener('submit', (event) => {
      event.preventDefault();
      const result = document.getElementById('result');
      const lines = [];
      let preview = '';
      for (const [name, value] of new FormData(event.target).entries()) {
        if (value instanceof File) {
          lines.push(`<div><b>${name}</b>: <code>${value.name}</code> (${Math.round(value.size / 1024)} KB, ${value.type})</div>`);
          preview = URL.createObjectURL(value);
        } else {
          lines.push(`<div><b>${name}</b>: <code>${value}</code></div>`);
        }
      }
      result.innerHTML = `<div><b>Sent to /cart/add</b></div>${lines.join('')}${preview ? `<img id="sent-photo" src="${preview}" alt="Cropped photo">` : ''}`;
      result.hidden = false;
    });
  </script>
</body>
</html>
