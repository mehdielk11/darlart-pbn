# Darl'Art website on a VPS: serves the built dist/ folder, and (optionally) the API on the same domain.
# Copy to /etc/nginx/sites-available/darlart, then:
#   sudo ln -s /etc/nginx/sites-available/darlart /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d darlart.example.com     (HTTPS, free)

server {
    listen 80;
    listen [::]:80;
    server_name darlart.example.com;           # <-- your domain

    root /var/www/darlart;                     # <-- where you copied dist/
    index index.html;

    # The generator runs in the browser and holds whole images in memory,
    # so only uploads through the API (if proxied below) need a larger limit.
    client_max_body_size 30m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The bundle's name contains its content hash, so it can be cached forever
    location ~* ^/main\.[0-9a-f]+\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Libraries, styles, fonts and the mockup kit scripts change rarely
    location ~* ^/(scripts|styles|mockups)/ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # OPTIONAL: the pbn-api on the same domain, for n8n or other services.
    # The website itself never calls it. Keep it closed unless you need it,
    # and remember every /v1 request needs the x-api-key header.
    # location /v1/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 600s;          # a template takes minutes
    #     client_max_body_size 30m;
    # }
}
